title: Prompt Injection via File Write or Tool Output
id: a0fc6a5a-7c68-5396-94d5-4096c8e5b013
status: stable
description: |
  Detects prompt injection patterns in content an agent writes to disk, and in
  the text a tool returns to the agent. Attackers can poison files that other
  agents or future sessions will read, and can seed the same instructions in
  fetched pages, command output or MCP tool results so the agent ingests them
  mid-task.

  Both event types carry the text in `content`. On a pre-execution `tool_call`
  it is the payload being written; on a post-execution `tool_response` it is the
  tool output, which the audit path supplies via
  internal/toolresult.DetectionFields.
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://attack.mitre.org/techniques/T1566/
  - https://embracethered.com/blog/posts/2024/claude-computer-use-c2-the-spaiware/
author: AgentShield
date: "2026-02-17"
modified: "2026-08-03"
tags:
  - attack.initial-access
  - attack.t1566
logsource:
  product: ai_agent
  category: agent_events
detection:
  selection_ignore:
    event_type:
      - tool_call
      - tool_response
    content|contains:
      - 'ignore previous instructions'
      - 'ignore all previous'
      - 'disregard previous'
      - 'disregard all previous'
      - 'forget your instructions'
      - 'override your instructions'
      - 'new instructions:'
      - 'system prompt:'
  selection_role_hijack:
    event_type:
      - tool_call
      - tool_response
    content|contains:
      - 'you are now'
      - 'act as if you are'
      - 'pretend you are'
      - 'from now on you'
      - 'your new role is'
  # Kept to tool_call. On a write, these literals describe a payload the agent
  # is authoring. In tool output they are ordinary prose: 'curl http' and
  # 'wget http' appear in almost every README and install transcript an agent
  # reads, so admitting them on tool_response would be a large false-positive
  # source for no detection gain.
  selection_exfil_instruction:
    event_type: tool_call
    content|contains:
      - 'send the contents to'
      - 'exfiltrate'
      - 'upload this to'
      - 'curl http'
      - 'wget http'
  # The imperative subset of the above, safe to apply to tool output because
  # each literal is an instruction aimed at the reader rather than a command
  # that documentation would quote.
  selection_exfil_instruction_in_output:
    event_type: tool_response
    content|contains:
      - 'send the contents to'
      - 'exfiltrate'
      - 'upload this to'
  condition: selection_ignore or selection_role_hijack or selection_exfil_instruction or selection_exfil_instruction_in_output
falsepositives:
  - Security researchers writing test files containing prompt injection examples
  - Documentation files that describe prompt injection patterns for educational purposes
  - Tool output quoting prompt-injection examples, such as reading this rule corpus or fetching a page about prompt injection
level: high
