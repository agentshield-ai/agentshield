id: agent-wallet-credential-001
title: Blockchain Wallet and Private Key Access
description: |
  Detects AI agent attempts to access blockchain wallet files, private keys,
  mnemonic seed phrases, or keystore files. As EVMBench demonstrates that AI
  agents can autonomously exploit smart contracts, protecting private key
  material becomes critical. An agent that gains access to wallet credentials
  can sign arbitrary transactions and drain funds.
author: AgentShield
date: "2026-02-22"
status: production
level: critical
logsource:
  product: agentshield
  category: agent_events
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.t1555
  - evmbench
detection:
  # File reads of wallet/keystore files
  selection_file_keystore:
    event_type: file_read
    file_path|contains:
      - 'keystore/'
      - '.ethereum/keystore'
      - 'keystores/'
  selection_file_wallet:
    event_type: file_read
    file_path|contains:
      - 'wallet.json'
      - 'wallet.dat'
      - '.wallet'
  # File reads of common private key file patterns
  selection_file_privkey:
    event_type: file_read
    file_path|endswith:
      - '.pem'
      - '.key'
    file_path|contains:
      - 'ethereum'
      - 'wallet'
      - 'crypto'
      - 'blockchain'
  # Command-based: reading private key files or env vars
  selection_cmd_privkey:
    event_type: tool_call
    command|contains:
      - 'PRIVATE_KEY'
      - 'DEPLOYER_KEY'
      - 'WALLET_KEY'
      - 'MNEMONIC'
      - 'SEED_PHRASE'
      - 'HD_WALLET'
  # Command-based: exporting or echoing private keys
  selection_cmd_export_key:
    event_type: tool_call
    command|re: '(echo|cat|export|printf)\s.*\b(0x[0-9a-fA-F]{64})\b'
  # Foundry wallet commands accessing keys
  selection_foundry_wallet:
    event_type: tool_call
    command|contains:
      - 'cast wallet'
      - 'cast wallet import'
      - 'cast wallet list'
      - 'forge wallet'
  # Searching for mnemonic / seed phrases in files
  selection_grep_mnemonic:
    event_type: tool_call
    command|contains:
      - 'grep'
      - 'rg'
      - 'ag'
    command|contains:
      - 'mnemonic'
      - 'seed phrase'
      - 'private_key'
      - 'privateKey'
      - 'secret_key'
      - 'secretKey'
  # Brownie accounts / Ape accounts access
  selection_framework_accounts:
    event_type: tool_call
    command|contains:
      - 'brownie accounts'
      - 'ape accounts'
  condition: >
    selection_file_keystore or selection_file_wallet or selection_file_privkey
    or selection_cmd_privkey or selection_cmd_export_key
    or selection_foundry_wallet or selection_grep_mnemonic
    or selection_framework_accounts
falsepositives:
  - Legitimate key management operations by authorized developers
  - Local development with test wallets and disposable keys
  - Automated deployment scripts using dedicated deployer accounts
