[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders, vendored detection rules, and attack-corpus fixtures"
paths = [
    '''rules/.*''',
    '''bench/testcases/.*''',
    # Verbatim rows from public labelled attack corpora, used as replay adapter
    # fixtures. The scenarios are synthetic by construction and are full of
    # invented tokens, API keys and wallet keys, which is the point of them.
    '''internal/replay/testdata/.*''',
    '''docs/.*''',
    '''.*\.md$''',
]
regexes = [
    '''(?i)bearer\s+(your[-_]?token|YOUR_TOKEN|test[-_]?token[-_a-z0-9]*)''',
    '''ci-bench-token-do-not-use-in-prod''',
]
