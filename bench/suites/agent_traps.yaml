name: agent_traps
description: |
  Tests aligned with the six AI Agent Trap categories identified by
  Franklin et al. (2026) in "AI Agent Traps" (SSRN 6372438). Covers
  semantic manipulation, approval fatigue, and override escalation patterns.
testcases:
  # Category 2: Semantic Manipulation Traps
  - semantic_manipulation/authority_hijack_sysadmin.yaml
  - semantic_manipulation/authority_hijack_policy.yaml
  - semantic_manipulation/urgency_skip_checks.yaml
  - semantic_manipulation/urgency_threat_shutdown.yaml
  - semantic_manipulation/benign_policy_reference.yaml
  # Category 6: Human-in-the-Loop Traps
  #
  # NOTE: the approval_fatigue/* testcases are intentionally NOT listed here.
  # They exercise session.approval_count / session.override_count, which are
  # engine-derived fields. The server now strips client-supplied values for
  # session.* keys (they can no longer be spoofed via the request body), so
  # these rules can only fire from real session-registry state built up over a
  # sequence of prior verdicts (and, for override_count, /api/v1/override
  # calls). Driving that requires the session registry enabled plus multi-event
  # state buildup, which this single-shot harness does not yet support. Re-add
  # them once the harness can construct genuine session state.
