[project]
name = "agentshield-gemini"
version = "1.0.0"
description = "AgentShield connector for the Google Gemini CLI"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# UP rules are omitted intentionally: the connector mirrors the established
# typing.Dict / typing.Optional idiom used across the sibling connectors so
# the codebase reads consistently.
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
