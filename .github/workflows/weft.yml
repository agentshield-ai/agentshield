name: Weft

on:
  push:
    # Any branch, so feature branches get feedback before a PR is opened.
    paths:
      - 'cmd/weft/**'
      - 'internal/weft/**'
      - 'web/weft-ui/**'
      - 'sdk/**'
      - 'plugins/weft-*/**'
      - 'scripts/weft_ui_licenses.mjs'
      - 'scripts/weft_weave_compat_check.py'
      - 'docs/weft/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/weft.yml'
  pull_request:
    paths:
      - 'cmd/weft/**'
      - 'internal/weft/**'
      - 'web/weft-ui/**'
      - 'sdk/**'
      - 'plugins/weft-*/**'
      - 'scripts/weft_ui_licenses.mjs'
      - 'scripts/weft_weave_compat_check.py'
      - 'docs/weft/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/weft.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/weft-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/weft-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Third-party licences of the bundle
        # vite build empties the output directory; regenerate THIRD_PARTY_LICENSES.txt.
        run: node ../../scripts/weft_ui_licenses.mjs
      - name: Embedded UI is up to date
        # The Go binary embeds internal/weft/webui/static; rebuild with `make weft-ui` and commit.
        run: git diff --exit-code -- ../../internal/weft/webui/static

  ui-browser:
    # The DESIGN.md §7.1 browser checks: every main page in light and dark at
    # 1440 and 390 px (axe WCAG 2.1 AA, no serious or critical violations; no
    # horizontal overflow; no console errors), the task tests with their click
    # counts, and keyboard, filter, view and undo behaviour. Runs against the
    # server's embedded UI, built from this commit; no Vite server.
    name: Web UI in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/weft-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: web/weft-ui
        run: npm ci --no-audit --no-fund
      - name: Build the UI into the server
        working-directory: web/weft-ui
        run: |
          npx vite build
          node ../../scripts/weft_ui_licenses.mjs
      - name: Start the server (compatibility adapter off, AgentShield rules for replay)
        run: |
          go build -o bin/weft ./cmd/weft
          ./bin/weft --addr 127.0.0.1:6345 --db "$RUNNER_TEMP/e2e.db" --shield-rules-dir rules/rules > "$RUNNER_TEMP/weft.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:6345/health && break; sleep 1; done
          curl -sf http://127.0.0.1:6345/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:6345/graphql)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:6345/calls/query)" = 404
      - name: Install Chromium
        # The browser build matches the @playwright/test version pinned in package.json.
        working-directory: web/weft-ui
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web/weft-ui
        env:
          WEFT_E2E_URL: http://127.0.0.1:6345
          WEFT_E2E_OUT: ${{ runner.temp }}/e2e
        run: npx playwright test
      - name: Click counts of the task tests
        if: always()
        run: cat "$RUNNER_TEMP/e2e/task-clicks.json" || true
      - name: Keep screenshots, accessibility results and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weft-ui-browser
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/weft.log
          retention-days: 7
          if-no-files-found: ignore

  sdks:
    name: Server and SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Go tests
        run: go test ./internal/weft/... ./cmd/weft/...
      - name: Go licence notices are up to date
        run: python3 scripts/go_licenses.py --check
      - name: Known vulnerabilities in reachable code (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./cmd/weft/... ./internal/weft/...
      - name: Go tests (database encrypted at rest)
        run: ./scripts/weft_test_encrypted.sh
      - name: Start server
        run: |
          go build -o bin/weft ./cmd/weft
          # default configuration: Weft's own API only; the SDKs, plugins and seed script use only /api/v1 (DESIGN.md §10)
          ./bin/weft --addr 127.0.0.1:6345 --db "$RUNNER_TEMP/weft.db" &
          for i in $(seq 30); do curl -sf http://127.0.0.1:6345/health && break; sleep 1; done
      - name: Python SDK tests (unit + against server)
        working-directory: sdk/python
        env:
          WEFT_TEST_SERVER_URL: http://127.0.0.1:6345
        run: |
          python -m pip install -e '.[test,otel]'
          python -m pytest -q
      - name: TypeScript SDK tests (unit + against server)
        working-directory: sdk/typescript
        env:
          WEFT_TEST_SERVER_URL: http://127.0.0.1:6345
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npx vitest run
          npm run build
      - name: Agent harness plugins (unit + against server)
        env:
          WEFT_TEST_SERVER_URL: http://127.0.0.1:6345
        run: node --test plugins/weft-claude-code/test/*.test.mjs plugins/weft-codex/test/*.test.mjs plugins/weft-openclaw/test/*.test.mjs plugins/weft-pi/test/*.test.mjs
      - name: Demo seed script
        run: python3 scripts/weft_seed_demo.py --traces 5
      - name: Compatibility adapter and the older route shapes are off by default
        run: |
          for p in /graphql /call/start /calls/query /obj/create; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:6345$p)" = 404 || { echo "$p is served"; exit 1; }
          done
          # GET too: unknown API paths and the adapter's routes are a JSON 404, not the UI.
          for p in /server_info /obj/read /calls/stream_query /api/v1/nonexistent; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6345$p)" = 404 || { echo "GET $p is served"; exit 1; }
            curl -s http://127.0.0.1:6345$p | grep -q '"reason"' || { echo "GET $p is not a JSON error"; exit 1; }
          done
      - name: Official weave client against Weft (compatibility adapter on)
        run: |
          ./bin/weft --addr 127.0.0.1:6346 --db "$RUNNER_TEMP/weft-compat.db" --weave-compat &
          for i in $(seq 30); do curl -sf http://127.0.0.1:6346/health && break; sleep 1; done
          python -m pip install 'weave==0.54.0'
          WEFT_URL=http://127.0.0.1:6346 python scripts/weft_weave_compat_check.py
