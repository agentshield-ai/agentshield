name: Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openclaw:
    name: OpenClaw plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/openclaw
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/openclaw/package.json

      - name: Install dependencies
        # No committed lockfile: this plugin is a published library and its
        # `openclaw` peerDependency must not be pinned here (.npmrc omits it).
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  hermes:
    name: Hermes plugin (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/hermes
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .

      - name: Run pytest
        working-directory: ${{ github.workspace }}
        run: pytest plugins/hermes/tests -v

  codex:
    name: Codex plugin (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/codex
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .

      - name: Run pytest
        working-directory: ${{ github.workspace }}
        run: pytest plugins/codex/tests -v

  gemini:
    name: Gemini plugin (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/gemini
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .

      - name: Run pytest
        run: pytest -v

  mcp-gateway:
    name: MCP gateway plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/mcp-gateway
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/mcp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
