name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build, smoke-test, scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          tags: agentshield-engine:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — start container and probe /health
        run: |
          mkdir -p ./ci-config
          cat > ./ci-config/config.yaml <<'EOF'
          server:
            # Bind all interfaces so the container is reachable through the
            # `-p 8433:8433` mapping (the default 127.0.0.1 is only reachable
            # inside the container). Safe here: auth is enabled.
            addr: 0.0.0.0
            port: 8433
          rules:
            dir: /rules
          mode: audit
          EOF

          # The engine requires an auth token to start (auth cannot be
          # disabled). Supply a dummy >=32-char token for the smoke test; the
          # /health endpoint is unauthenticated, so the probe still succeeds.
          docker run -d --name agentshield-ci \
            -p 8433:8433 \
            -e AGENTSHIELD_AUTH_TOKEN=ci-smoke-test-dummy-token-not-a-secret \
            -v "$PWD/ci-config/config.yaml:/config.yaml:ro" \
            agentshield-engine:ci

          if ! scripts/wait_for_health.sh; then
            docker logs agentshield-ci
            exit 1
          fi
          docker logs agentshield-ci

      - name: Stop container
        if: always()
        run: docker rm -f agentshield-ci || true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentshield-engine:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
